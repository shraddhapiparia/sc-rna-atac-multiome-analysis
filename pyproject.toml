[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sc-rna-atac-regulon-benchmark"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "anndata>=0.10",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
